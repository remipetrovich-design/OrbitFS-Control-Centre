name: Clear stale Engine queue

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clear-engine-queue.yml

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Engine promotion run
        env:
          GH_TOKEN: ${{ secrets.ORBITFS_FALLBACK_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/remipetrovich-design/OrbitFS_Engine/actions/runs/37157892120/force-cancel"

# force-cancel retry
