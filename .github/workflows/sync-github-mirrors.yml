name: Sync GitHub mirrors

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SYNC to mirror all five main branches in this direction
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: orbitfs-five-repo-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync five main repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_TOKEN: ${{ github.repository == 'lucaskerim123/Dev-panel' && secrets.ORBITFS_RELEASE_DISPATCH_TOKEN || secrets.ORBITFS_FALLBACK_GITHUB_TOKEN }}
      TARGET_TOKEN: ${{ github.repository == 'lucaskerim123/Dev-panel' && secrets.ORBITFS_FALLBACK_GITHUB_TOKEN || secrets.ORBITFS_RELEASE_DISPATCH_TOKEN }}
    steps:
      - name: Verify direction and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "SYNC" || { echo "::error::Confirmation must be SYNC."; exit 1; }
          case "$GITHUB_REPOSITORY" in
            lucaskerim123/Dev-panel|remipetrovich-design/OrbitFS-Control-Centre) ;;
            *) echo "::error::This workflow may only run from Dev-panel or OrbitFS-Control-Centre."; exit 1 ;;
          esac
          test -n "${SOURCE_TOKEN:-}" || { echo "::error::Source GitHub credential is missing."; exit 1; }
          test -n "${TARGET_TOKEN:-}" || { echo "::error::Target GitHub credential is missing."; exit 1; }

          if [ "$GITHUB_REPOSITORY" = "remipetrovich-design/OrbitFS-Control-Centre" ]; then
            target_repos=(
              "lucaskerim123/V1-vercel-base"
              "lucaskerim123/V1-vercel-engine"
              "lucaskerim123/Custom-licence-manager"
              "lucaskerim123/V2_Billing_Store"
              "lucaskerim123/Dev-panel"
            )
            target_label="Lucas primary"
            target_secret="ORBITFS_RELEASE_DISPATCH_TOKEN"
          else
            target_repos=(
              "remipetrovich-design/OrbitFS-Base-System"
              "remipetrovich-design/OrbitFS_Engine"
              "remipetrovich-design/OrbitFS-License-Administration"
              "remipetrovich-design/OrbitFS-Billing-Shopfront"
              "remipetrovich-design/OrbitFS-Control-Centre"
            )
            target_label="Remi fallback"
            target_secret="ORBITFS_FALLBACK_GITHUB_TOKEN"
          fi

          failed=0
          for target_repo in "${target_repos[@]}"; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --location               --output "$response_file"               --write-out "%{http_code}"               -H "Authorization: Bearer $TARGET_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$target_repo")"
            if [ "$status" != "200" ]; then
              echo "::error::Target credential $target_secret cannot access $target_repo (GitHub HTTP $status)."
              failed=1
            elif [ "$(jq -r '.permissions.push // false' "$response_file")" != "true" ]; then
              echo "::error::Target credential $target_secret can read $target_repo but does not have push permission."
              failed=1
            else
              echo "Verified target write permission: $target_repo"
            fi
            rm -f "$response_file"
          done
          test "$failed" = "0" || {
            echo "::error::$target_label sync credential is not writable for all five target repositories. Update the named Actions secret before retrying repository sync."
            exit 1
          }

      - name: Checkout Base source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'lucaskerim123/V1-vercel-base' || 'remipetrovich-design/OrbitFS-Base-System' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          path: source-base
      - name: Checkout Base target
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'remipetrovich-design/OrbitFS-Base-System' || 'lucaskerim123/V1-vercel-base' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-base

      - name: Checkout Engine source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'lucaskerim123/V1-vercel-engine' || 'remipetrovich-design/OrbitFS_Engine' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          path: source-engine
      - name: Checkout Engine target
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'remipetrovich-design/OrbitFS_Engine' || 'lucaskerim123/V1-vercel-engine' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-engine

      - name: Checkout License source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'lucaskerim123/Custom-licence-manager' || 'remipetrovich-design/OrbitFS-License-Administration' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          path: source-license
      - name: Checkout License target
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'remipetrovich-design/OrbitFS-License-Administration' || 'lucaskerim123/Custom-licence-manager' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-license

      - name: Checkout Billing source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'lucaskerim123/V2_Billing_Store' || 'remipetrovich-design/OrbitFS-Billing-Shopfront' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          path: source-billing
      - name: Checkout Billing target
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'remipetrovich-design/OrbitFS-Billing-Shopfront' || 'lucaskerim123/V2_Billing_Store' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-billing

      - name: Checkout Control source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'lucaskerim123/Dev-panel' || 'remipetrovich-design/OrbitFS-Control-Centre' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          path: source-control
      - name: Checkout Control target
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository == 'lucaskerim123/Dev-panel' && 'remipetrovich-design/OrbitFS-Control-Centre' || 'lucaskerim123/Dev-panel' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-control

      - name: Prepare and preflight all five targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbitfs-sync"

          normalize_for_target() {
            local root="$1"
            local key="$2"
            local strict="${3:-true}"
            local target_base target_engine target_license target_billing target_control target_profile target_label target_token_env
            if [ "$GITHUB_REPOSITORY" = "lucaskerim123/Dev-panel" ]; then
              target_base="remipetrovich-design/OrbitFS-Base-System"
              target_engine="remipetrovich-design/OrbitFS_Engine"
              target_license="remipetrovich-design/OrbitFS-License-Administration"
              target_billing="remipetrovich-design/OrbitFS-Billing-Shopfront"
              target_control="remipetrovich-design/OrbitFS-Control-Centre"
              target_profile="fallback"
              target_label="Remi fallback"
              target_token_env="ORBITFS_FALLBACK_GITHUB_TOKEN"
            else
              target_base="lucaskerim123/V1-vercel-base"
              target_engine="lucaskerim123/V1-vercel-engine"
              target_license="lucaskerim123/Custom-licence-manager"
              target_billing="lucaskerim123/V2_Billing_Store"
              target_control="lucaskerim123/Dev-panel"
              target_profile="primary"
              target_label="Primary"
              target_token_env="ORBITFS_RELEASE_DISPATCH_TOKEN"
            fi

            ROOT="$root" KEY="$key" STRICT="$strict" TARGET_BASE_REPO="$target_base" TARGET_ENGINE_REPO="$target_engine" TARGET_LICENSE_REPO="$target_license" TARGET_BILLING_REPO="$target_billing" TARGET_CONTROL_REPO="$target_control" TARGET_PROFILE="$target_profile" TARGET_LABEL="$target_label" TARGET_TOKEN_ENV="$target_token_env" node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=process.env.ROOT;
          const key=process.env.KEY;
          const strict=process.env.STRICT==='true';
          const targetBase=process.env.TARGET_BASE_REPO;
          const targetEngine=process.env.TARGET_ENGINE_REPO;
          const targetLicense=process.env.TARGET_LICENSE_REPO;
          const targetBilling=process.env.TARGET_BILLING_REPO;
          const targetControl=process.env.TARGET_CONTROL_REPO;
          const targetProfile=process.env.TARGET_PROFILE;
          const targetLabel=process.env.TARGET_LABEL;
          const targetTokenEnv=process.env.TARGET_TOKEN_ENV;
          const baseRepos=['lucaskerim123/V1-vercel-base','remipetrovich-design/OrbitFS-Base-System'];
          const engineRepos=['lucaskerim123/V1-vercel-engine','remipetrovich-design/OrbitFS_Engine'];
          const licenseRepos=['lucaskerim123/Custom-licence-manager','remipetrovich-design/OrbitFS-License-Administration'];
          const billingRepos=['lucaskerim123/V2_Billing_Store','remipetrovich-design/OrbitFS-Billing-Shopfront'];
          const controlRepos=['lucaskerim123/Dev-panel','remipetrovich-design/OrbitFS-Control-Centre'];
          const read=(p)=>fs.readFileSync(path.join(root,p),'utf8');
          const write=(p,v)=>fs.writeFileSync(path.join(root,p),v);
          const normalize=(value,list,target)=>list.reduce((out,item)=>out.split(item).join(target),value).split('UPDATE_RELEASES').join('UPDATE_RELEASE');

          if(key==='base'){
            for(const p of ['src/lib/server/database-package-registry.ts','src/lib/server/engine-branch-client.ts','tools/build-database-package.mjs']){
              if(!fs.existsSync(path.join(root,p))){if(strict)throw new Error('Missing target-specific Base identity file: '+p);continue;}
              let value=read(p);
              value=normalize(value,baseRepos,targetBase);
              value=normalize(value,engineRepos,targetEngine);
              write(p,value);
            }
          } else if(key==='engine'){
            const pkg='tools/build-database-package.mjs';
            const baseline='release/update-baseline.json';
            const hasEngineIdentity=fs.existsSync(path.join(root,pkg))&&fs.existsSync(path.join(root,baseline));
            if(!hasEngineIdentity){
              if(strict)throw new Error('Missing target-specific Engine identity file.');
            }else{
              write(pkg,normalize(read(pkg),engineRepos,targetEngine));
              const data=JSON.parse(read(baseline));
              data.sourceRepository=targetEngine;
              data.releaseBranch='UPDATE_RELEASE';
              if(typeof data.note==='string')data.note=data.note.split('UPDATE_RELEASES').join('UPDATE_RELEASE');
              write(baseline,JSON.stringify(data,null,2)+'\n');
            }
          } else if(key==='license'){
            const files=[
              'app/layout.tsx',
              'app/api/v1/releases/route.ts',
              'app/api/v1/license/validate/route.ts',
              'app/api/v1/engine-bootstrap/route.ts',
              'lib/core/database-packages.ts',
              'lib/core/releases.ts',
              'scripts/release-manifest.mjs',
              'scripts/release-manifest.test.mjs',
              'database/migrations/20261004100000_license_manager_github_profile.sql'
            ];
            for(const p of files){
              if(!fs.existsSync(path.join(root,p))){if(strict)throw new Error('Missing target-specific License Manager identity file: '+p);continue;}
              let value=read(p);
              value=normalize(value,baseRepos,targetBase);
              value=normalize(value,engineRepos,targetEngine);
              value=normalize(value,licenseRepos,targetLicense);
              value=normalize(value,billingRepos,targetBilling);
              value=normalize(value,controlRepos,targetControl);
              if(p==='lib/core/releases.ts'||p==='app/api/v1/engine-bootstrap/route.ts'){
                value=value.replace(/ORBITFS_(?:FALLBACK_GITHUB_TOKEN|RELEASE_DISPATCH_TOKEN)/g,targetTokenEnv);
              }
              if(p==='app/layout.tsx'){
                value=value.replace(/const LOCAL_PROFILE='(?:primary|fallback)' as const;/,"const LOCAL_PROFILE='"+targetProfile+"' as const;");
                value=value.replace(/const LOCAL_LABEL='[^']*';/,"const LOCAL_LABEL='"+targetLabel.replace(/'/g,"\\'")+"';");
              }
              if(p==='database/migrations/20261004100000_license_manager_github_profile.sql'){
                value=value.replace(/default '(?:primary|fallback)'/,"default '"+targetProfile+"'");
              }
              write(p,value);
            }
          } else if(key==='control'){
            const p='src/lib/github-profile.ts';
            if(!fs.existsSync(path.join(root,p))){
              if(strict)throw new Error('Missing target-specific Control Centre identity file: '+p);
            }else{
              let value=read(p).split('UPDATE_RELEASES').join('UPDATE_RELEASE');
              const localProfileSymbol=targetProfile==='primary'?'PRIMARY':'FALLBACK';
              value=value.replace(/const LOCAL_PROFILE:GithubProfile=(?:PRIMARY|FALLBACK);/,"const LOCAL_PROFILE:GithubProfile="+localProfileSymbol+";");
              write(p,value);
            }
          }
          NODE
          }

          assert_no_target_only_drift() {
            local src="$1"
            local dst="$2"
            local key="$3"
            local drift_file="$RUNNER_TEMP/orbitfs-sync/$key.target-drift"
            local last_sync
            : > "$drift_file"
            last_sync="$(git -C "$dst" log --format='%H' --grep='^Sync main from ' -n 1 || true)"

            if [ -z "$last_sync" ]; then
              echo "::notice::$key has no prior inbound mirror marker; treating this run as the bootstrap baseline."
              return
            fi

            while IFS= read -r changed_path; do
              [ -n "$changed_path" ] || continue
              case "$changed_path" in
                .github/workflows/*) continue ;;
              esac

              if [ -e "$src/$changed_path" ] && [ -e "$dst/$changed_path" ]; then
                cmp -s "$src/$changed_path" "$dst/$changed_path" || printf '%s\n' "$changed_path" >> "$drift_file"
              elif [ -e "$src/$changed_path" ] || [ -e "$dst/$changed_path" ]; then
                printf '%s\n' "$changed_path" >> "$drift_file"
              fi
            done < <(git -C "$dst" diff --name-only "$last_sync"..HEAD)

            if [ -s "$drift_file" ]; then
              echo "::error::$key target contains changes made after its last inbound mirror sync that are not present in the selected source."
              echo "::error::Sync in the opposite direction first or reconcile these files manually; this workflow will not overwrite them."
              sort -u "$drift_file"
              exit 1
            fi
          }

          for key in base engine license billing control; do
            src="source-$key"
            dst="target-$key"
            echo "::group::Prepare $key"
            git -C "$dst" rev-parse HEAD > "$RUNNER_TEMP/orbitfs-sync/$key.expected"

            # Convert both temporary trees to the target repository identity before
            # comparing them. Shared logic is still compared byte-for-byte, while
            # repository-specific names stay correct on each GitHub profile.
            normalize_for_target "$src" "$key" true
            normalize_for_target "$dst" "$key" false
            assert_no_target_only_drift "$src" "$dst" "$key"

            excludes=(--exclude=".git/" --exclude=".github/workflows/")
            rsync -a --delete "${excludes[@]}" "$src/" "$dst/"
            normalize_for_target "$dst" "$key" true

            remaining="$(rsync -ani --delete "${excludes[@]}" "$src/" "$dst/")"
            test -z "$remaining" || { echo "::error::Mirror verification failed for $key."; printf "%s\n" "$remaining"; exit 1; }

            git -C "$dst" config user.name "OrbitFS Repository Sync"
            git -C "$dst" config user.email "actions@users.noreply.github.com"
            git -C "$dst" add -A -f
            if git -C "$dst" diff --cached --quiet; then
              if git -C "$dst" log -1 --format='%s' | grep -qx 'Sync main from mirror source'; then
                echo "current" > "$RUNNER_TEMP/orbitfs-sync/$key.state"
                echo "$key already current and marker is present"
              else
                echo "changed" > "$RUNNER_TEMP/orbitfs-sync/$key.state"
                git -C "$dst" commit --allow-empty --quiet -m "Sync main from mirror source"
                target_ref="main"
                git -C "$dst" push --dry-run origin "HEAD:$target_ref"
                echo "$key content is current; bootstrap marker prepared"
              fi
            else
              echo "changed" > "$RUNNER_TEMP/orbitfs-sync/$key.state"
              git -C "$dst" commit --quiet -m "Sync main from mirror source"
              target_ref="main"
              git -C "$dst" push --dry-run origin "HEAD:$target_ref"
              echo "$key prepared and push permission verified"
            fi
            echo "::endgroup::"
          done

      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" = "lucaskerim123/Dev-panel" ]; then
            direction="lucaskerim123 → remipetrovich-design"
          else
            direction="remipetrovich-design → lucaskerim123"
          fi
          {
            echo "## Repository mirror sync"
            echo ""
            echo "**Direction:** $direction"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Re-check every target before the first push so a late edit cannot
          # leave the five repositories half-synced.
          for key in base engine license billing control; do
            dst="target-$key"
            expected="$(cat "$RUNNER_TEMP/orbitfs-sync/$key.expected")"
            git -C "$dst" fetch --quiet origin main
            remote_before="$(git -C "$dst" rev-parse origin/main)"
            test "$remote_before" = "$expected" || { echo "::error::Remote main changed after preflight for $key; refusing to start a partial five-repo sync."; exit 1; }
          done

          for key in base engine license billing control; do
            src="source-$key"
            dst="target-$key"
            target_ref="main"
            state="$(cat "$RUNNER_TEMP/orbitfs-sync/$key.state")"
            if [ "$state" = "changed" ]; then
              expected="$(cat "$RUNNER_TEMP/orbitfs-sync/$key.expected")"
              git -C "$dst" fetch --quiet origin "$target_ref"
              remote_before="$(git -C "$dst" rev-parse "origin/$target_ref")"
              test "$remote_before" = "$expected" || { echo "::error::Remote $target_ref changed after preflight for $key; refusing to overwrite newer work."; exit 1; }
              git -C "$dst" push origin "HEAD:$target_ref"
              git -C "$dst" fetch --quiet origin "$target_ref"
              test "$(git -C "$dst" rev-parse HEAD)" = "$(git -C "$dst" rev-parse "origin/$target_ref")" || { echo "::error::Remote main verification failed for $key."; exit 1; }
              test "$(git -C "$dst" log -1 --format='%s' "origin/$target_ref")" = "Sync main from mirror source" || { echo "::error::Remote main marker verification failed for $key."; exit 1; }
              excludes=(--exclude=".git/" --exclude=".github/workflows/")
              remaining="$(rsync -ani --delete "${excludes[@]}" "$src/" "$dst/")"
              test -z "$remaining" || { echo "::error::Post-push mirror verification failed for $key."; printf "%s\n" "$remaining"; exit 1; }
              echo "- ✅ $key — synced and verified (target workflows preserved)" >> "$GITHUB_STEP_SUMMARY"
            else
              git -C "$dst" fetch --quiet origin "$target_ref"
              test "$(git -C "$dst" log -1 --format='%s' "origin/$target_ref")" = "Sync main from mirror source" || { echo "::error::Remote main marker verification failed for current $key."; exit 1; }
              echo "- ✅ $key — already current and marker verified" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All five target main branches match the selected source within mirror scope. Target-specific GitHub workflows are preserved." >> "$GITHUB_STEP_SUMMARY"
