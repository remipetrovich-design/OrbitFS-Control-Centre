name: Sync GitHub mirrors
run-name: OrbitFS sync ${{ inputs.preview == 'true' && 'PREVIEW' || 'APPLY' }} · ${{ inputs.pair }} · ${{ inputs.direction }} · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      pair:
        description: Repository pair to synchronize, one at a time
        required: true
        type: choice
        options:
          - base
          - engine
          - license
          - billing
          - control
      direction:
        description: Explicit source-to-target direction, independent of active mode
        required: true
        type: choice
        options:
          - main-to-fallback
          - fallback-to-main
      preview:
        description: Preview/preflight only; never push changes
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirmation:
        description: Type SYNC to preview or apply the selected repository only
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: orbitfs-repository-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync selected repository pair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYNC_PAIR: ${{ inputs.pair }}
      SYNC_DIRECTION: ${{ inputs.direction }}
      SOURCE_TOKEN: ${{ inputs.direction == 'main-to-fallback' && (secrets.MAIN_GITHUB_TOKEN || secrets.ORBITFS_RELEASE_DISPATCH_TOKEN) || (secrets.FALLBACK_GITHUB_TOKEN || secrets.ORBITFS_FALLBACK_GITHUB_TOKEN) }}
      TARGET_TOKEN: ${{ inputs.direction == 'main-to-fallback' && (secrets.FALLBACK_GITHUB_TOKEN || secrets.ORBITFS_FALLBACK_GITHUB_TOKEN) || (secrets.MAIN_GITHUB_TOKEN || secrets.ORBITFS_RELEASE_DISPATCH_TOKEN) }}
    steps:
      - name: Verify direction and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${{ vars.ORBITFS_REPOSITORY_SYNC_ENABLED }}" = "true" || { echo "::error::Cross-mode sync is disabled. Explicitly activate repository variable ORBITFS_REPOSITORY_SYNC_ENABLED=true before manual dispatch."; exit 1; }
          test "${{ inputs.confirmation }}" = "SYNC" || { echo "::error::Confirmation must be SYNC."; exit 1; }
          case "$SYNC_PAIR" in base|engine|license|billing|control) ;; *) echo "::error::Invalid selected pair."; exit 1 ;; esac
          case "$SYNC_DIRECTION" in main-to-fallback|fallback-to-main) ;; *) echo "::error::Invalid direction."; exit 1 ;; esac
          case "$GITHUB_REPOSITORY" in
            lucaskerim123/Dev-panel|remipetrovich-design/OrbitFS-Control-Centre) ;;
            *) echo "::error::This workflow may only run from Dev-panel or OrbitFS-Control-Centre."; exit 1 ;;
          esac
          test -n "${SOURCE_TOKEN:-}" || { echo "::error::Source GitHub credential is missing."; exit 1; }
          test -n "${TARGET_TOKEN:-}" || { echo "::error::Target GitHub credential is missing."; exit 1; }

          if [ "$SYNC_DIRECTION" = "fallback-to-main" ]; then
            target_repos=(
              "lucaskerim123/V1-vercel-base"
              "lucaskerim123/V1-vercel-engine"
              "lucaskerim123/Custom-licence-manager"
              "lucaskerim123/V2_Billing_Store"
              "lucaskerim123/Dev-panel"
            )
            target_label="Lucas primary"
            target_secret="ORBITFS_RELEASE_DISPATCH_TOKEN"
          else
            target_repos=(
              "remipetrovich-design/OrbitFS-Base-System"
              "remipetrovich-design/OrbitFS_Engine"
              "remipetrovich-design/OrbitFS-License-Administration"
              "remipetrovich-design/OrbitFS-Billing-Shopfront"
              "remipetrovich-design/OrbitFS-Control-Centre"
            )
            target_label="Remi fallback"
            target_secret="ORBITFS_FALLBACK_GITHUB_TOKEN"
          fi

          case "$SYNC_PAIR" in
            base) pair_index=0 ;;
            engine) pair_index=1 ;;
            license) pair_index=2 ;;
            billing) pair_index=3 ;;
            control) pair_index=4 ;;
          esac
          target_repos=("${target_repos[$pair_index]}")
          echo "Selected pair: $SYNC_PAIR · direction: $SYNC_DIRECTION"
          failed=0
          for target_repo in "${target_repos[@]}"; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --location               --output "$response_file"               --write-out "%{http_code}"               -H "Authorization: Bearer $TARGET_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$target_repo")"
            if [ "$status" != "200" ]; then
              echo "::error::Target credential $target_secret cannot access $target_repo (GitHub HTTP $status)."
              failed=1
            elif [ "$(jq -r '.permissions.push // false' "$response_file")" != "true" ]; then
              echo "::error::Target credential $target_secret can read $target_repo but does not have push permission."
              failed=1
            else
              echo "Verified target write permission: $target_repo"
            fi
            rm -f "$response_file"
          done
          test "$failed" = "0" || {
            echo "::error::$target_label sync credential is not writable for the selected target repository. Update the named Actions secret before retrying repository sync."
            exit 1
          }

      - name: Checkout Base source
        if: ${{ inputs.pair == 'base' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'lucaskerim123/V1-vercel-base' || 'remipetrovich-design/OrbitFS-Base-System' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source-base
      - name: Checkout Base target
        if: ${{ inputs.pair == 'base' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'remipetrovich-design/OrbitFS-Base-System' || 'lucaskerim123/V1-vercel-base' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-base

      - name: Checkout Engine source
        if: ${{ inputs.pair == 'engine' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'lucaskerim123/V1-vercel-engine' || 'remipetrovich-design/OrbitFS_Engine' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source-engine
      - name: Checkout Engine target
        if: ${{ inputs.pair == 'engine' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'remipetrovich-design/OrbitFS_Engine' || 'lucaskerim123/V1-vercel-engine' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-engine

      - name: Checkout License source
        if: ${{ inputs.pair == 'license' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'lucaskerim123/Custom-licence-manager' || 'remipetrovich-design/OrbitFS-License-Administration' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source-license
      - name: Checkout License target
        if: ${{ inputs.pair == 'license' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'remipetrovich-design/OrbitFS-License-Administration' || 'lucaskerim123/Custom-licence-manager' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-license

      - name: Checkout Billing source
        if: ${{ inputs.pair == 'billing' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'lucaskerim123/V2_Billing_Store' || 'remipetrovich-design/OrbitFS-Billing-Shopfront' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source-billing
      - name: Checkout Billing target
        if: ${{ inputs.pair == 'billing' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'remipetrovich-design/OrbitFS-Billing-Shopfront' || 'lucaskerim123/V2_Billing_Store' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-billing

      - name: Checkout Control source
        if: ${{ inputs.pair == 'control' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'lucaskerim123/Dev-panel' || 'remipetrovich-design/OrbitFS-Control-Centre' }}
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source-control
      - name: Checkout Control target
        if: ${{ inputs.pair == 'control' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.direction == 'main-to-fallback' && 'remipetrovich-design/OrbitFS-Control-Centre' || 'lucaskerim123/Dev-panel' }}
          ref: main
          token: ${{ env.TARGET_TOKEN }}
          fetch-depth: 0
          path: target-control

      - name: Prepare and preflight selected repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbitfs-sync"

          normalize_for_target() {
            local root="$1"
            local key="$2"
            local strict="${3:-true}"
            local target_base target_engine target_engine_id target_license target_billing target_control target_profile target_label target_token_env
            if [ "$SYNC_DIRECTION" = "main-to-fallback" ]; then
              target_base="remipetrovich-design/OrbitFS-Base-System"
              target_engine="remipetrovich-design/OrbitFS_Engine"
              target_engine_id="1393749443"
              target_license="remipetrovich-design/OrbitFS-License-Administration"
              target_billing="remipetrovich-design/OrbitFS-Billing-Shopfront"
              target_control="remipetrovich-design/OrbitFS-Control-Centre"
              target_profile="fallback"
              target_label="Remi fallback"
              target_token_env="ORBITFS_FALLBACK_GITHUB_TOKEN"
            else
              target_base="lucaskerim123/V1-vercel-base"
              target_engine="lucaskerim123/V1-vercel-engine"
              target_engine_id="1358790703"
              target_license="lucaskerim123/Custom-licence-manager"
              target_billing="lucaskerim123/V2_Billing_Store"
              target_control="lucaskerim123/Dev-panel"
              target_profile="primary"
              target_label="Primary"
              target_token_env="ORBITFS_RELEASE_DISPATCH_TOKEN"
            fi

            ROOT="$root" KEY="$key" STRICT="$strict" TARGET_BASE_REPO="$target_base" TARGET_ENGINE_REPO="$target_engine" TARGET_ENGINE_REPO_ID="$target_engine_id" TARGET_LICENSE_REPO="$target_license" TARGET_BILLING_REPO="$target_billing" TARGET_CONTROL_REPO="$target_control" TARGET_PROFILE="$target_profile" TARGET_LABEL="$target_label" TARGET_TOKEN_ENV="$target_token_env" node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const root=process.env.ROOT;
          const key=process.env.KEY;
          const strict=process.env.STRICT==='true';
          const targetBase=process.env.TARGET_BASE_REPO;
          const targetEngine=process.env.TARGET_ENGINE_REPO;
          const targetEngineRepoId=process.env.TARGET_ENGINE_REPO_ID;
          const targetLicense=process.env.TARGET_LICENSE_REPO;
          const targetBilling=process.env.TARGET_BILLING_REPO;
          const targetControl=process.env.TARGET_CONTROL_REPO;
          const targetProfile=process.env.TARGET_PROFILE;
          const targetLabel=process.env.TARGET_LABEL;
          const targetTokenEnv=process.env.TARGET_TOKEN_ENV;
          const baseRepos=['lucaskerim123/V1-vercel-base','remipetrovich-design/OrbitFS-Base-System'];
          const engineRepos=['lucaskerim123/V1-vercel-engine','remipetrovich-design/OrbitFS_Engine'];
          const licenseRepos=['lucaskerim123/Custom-licence-manager','remipetrovich-design/OrbitFS-License-Administration'];
          const billingRepos=['lucaskerim123/V2_Billing_Store','remipetrovich-design/OrbitFS-Billing-Shopfront'];
          const controlRepos=['lucaskerim123/Dev-panel','remipetrovich-design/OrbitFS-Control-Centre'];
          const read=(p)=>fs.readFileSync(path.join(root,p),'utf8');
          const write=(p,v)=>{const file=path.join(root,p);if(fs.readFileSync(file,'utf8')!==v)fs.writeFileSync(file,v);};
          const normalize=(value,list,target)=>list.reduce((out,item)=>out.split(item).join(target),value).split('UPDATE_RELEASES').join('UPDATE_RELEASE');

          if(key==='base'){
            for(const p of ['src/lib/server/database-package-registry.ts','src/lib/server/engine-branch-client.ts','src/lib/server/vercel-engine-provision.ts','src/lib/server/update-checkpoints.ts','tools/build-database-package.mjs']){
              if(!fs.existsSync(path.join(root,p))){if(strict)throw new Error('Missing target-specific Base identity file: '+p);continue;}
              let value=read(p);
              value=normalize(value,baseRepos,targetBase);
              value=normalize(value,engineRepos,targetEngine);
              write(p,value);
            }
          } else if(key==='engine'){
            const pkg='tools/build-database-package.mjs';
            const baseline='release/update-baseline.json';
            const hasEngineIdentity=fs.existsSync(path.join(root,pkg))&&fs.existsSync(path.join(root,baseline));
            if(!hasEngineIdentity){
              if(strict)throw new Error('Missing target-specific Engine identity file.');
            }else{
              write(pkg,normalize(read(pkg),engineRepos,targetEngine));
              const data=JSON.parse(read(baseline));
              data.sourceRepository=targetEngine;
              data.releaseBranch='UPDATE_RELEASE';
              if(typeof data.note==='string')data.note=data.note.split('UPDATE_RELEASES').join('UPDATE_RELEASE');
              write(baseline,JSON.stringify(data,null,2)+'\n');
            }
          } else if(key==='license'){
            const files=[
              'app/layout.tsx',
              'app/api/v1/releases/route.ts',
              'app/api/v1/license/validate/route.ts',
              'app/api/v1/engine-bootstrap/route.ts',
              'lib/core/database-packages.ts',
              'lib/core/releases.ts',
              'scripts/release-manifest.mjs',
              'scripts/release-manifest.test.mjs',
              'database/migrations/20261004100000_license_manager_github_profile.sql'
            ];
            for(const p of files){
              if(!fs.existsSync(path.join(root,p))){if(strict)throw new Error('Missing target-specific License Manager identity file: '+p);continue;}
              let value=read(p);
              value=normalize(value,baseRepos,targetBase);
              value=normalize(value,engineRepos,targetEngine);
              value=normalize(value,licenseRepos,targetLicense);
              value=normalize(value,billingRepos,targetBilling);
              value=normalize(value,controlRepos,targetControl);
              if(p==='lib/core/releases.ts'||p==='app/api/v1/engine-bootstrap/route.ts'){
                value=value.replace(/ORBITFS_(?:FALLBACK_GITHUB_TOKEN|RELEASE_DISPATCH_TOKEN)/g,targetTokenEnv);
              }
              if(p==='app/api/v1/engine-bootstrap/route.ts'){
                value=value.replace(/String\(repository\.id\) !== '\d+'/,"String(repository.id) !== '"+targetEngineRepoId+"'");
              }
              if(p==='app/layout.tsx'){
                value=value.replace(/const LOCAL_PROFILE='(?:primary|fallback)' as const;/,"const LOCAL_PROFILE='"+targetProfile+"' as const;");
                value=value.replace(/const LOCAL_LABEL='[^']*';/,"const LOCAL_LABEL='"+targetLabel.replace(/'/g,"\\'")+"';");
              }
              if(p==='database/migrations/20261004100000_license_manager_github_profile.sql'){
                value=value.replace(/default '(?:primary|fallback)'/,"default '"+targetProfile+"'");
              }
              write(p,value);
            }
          } else if(key==='billing'){
            const files=['scripts/release-manifest.mjs'];
            for(const p of files){
              if(!fs.existsSync(path.join(root,p))){if(strict)throw new Error('Missing target-specific Billing identity file: '+p);continue;}
              let value=read(p);
              value=normalize(value,billingRepos,targetBilling);
              write(p,value);
            }
          } else if(key==='control'){
            const p='src/lib/github-profile.ts';
            if(!fs.existsSync(path.join(root,p))){
              if(strict)throw new Error('Missing target-specific Control Centre identity file: '+p);
            }else{
              let value=read(p).split('UPDATE_RELEASES').join('UPDATE_RELEASE');
              const localProfileSymbol=targetProfile==='primary'?'PRIMARY':'FALLBACK';
              value=value.replace(/const LOCAL_PROFILE:GithubProfile=(?:PRIMARY|FALLBACK);/,"const LOCAL_PROFILE:GithubProfile="+localProfileSymbol+";");
              write(p,value);
            }
          }

          const mustContain=(p,needle,label)=>{
            if(!fs.existsSync(path.join(root,p)))throw new Error('Identity verification missing '+label+' file: '+p);
            const value=read(p);
            if(!value.includes(needle))throw new Error('Identity verification failed for '+label+': expected '+needle+' in '+p);
          };
          const mustNotContain=(p,needle,label)=>{
            if(!fs.existsSync(path.join(root,p)))throw new Error('Identity verification missing '+label+' file: '+p);
            if(read(p).includes(needle))throw new Error('Identity verification failed for '+label+': unexpected '+needle+' in '+p);
          };

          if(key==='base'){
            mustContain('src/lib/server/engine-branch-client.ts',targetEngine,'Base Engine branch client identity');
            mustContain('src/lib/server/vercel-engine-provision.ts','github:'+targetEngine+'@','Base Engine branch identity');
            mustContain('src/lib/server/update-checkpoints.ts','github:'+targetEngine+'@','Base Engine checkpoint identity');
          }else if(key==='license'){
            mustContain('app/layout.tsx',"const LOCAL_PROFILE='"+targetProfile+"' as const",'License Manager local profile');
            mustContain('database/migrations/20261004100000_license_manager_github_profile.sql',"default '"+targetProfile+"'",'License Manager first-run profile');
            mustContain('app/api/v1/engine-bootstrap/route.ts',targetEngine,'License Manager Engine repository');
            // Engine bootstrap now validates repository.full_name through the active
            // GitHub profile. Do not require the retired hard-coded numeric repo id.
          }else if(key==='billing'){
            mustContain('scripts/release-manifest.mjs',targetBilling,'Billing manifest repository');
          }else if(key==='control'){
            const localProfileSymbol=targetProfile==='primary'?'PRIMARY':'FALLBACK';
            mustContain('src/lib/github-profile.ts','const LOCAL_PROFILE:GithubProfile='+localProfileSymbol+';','Control Centre local profile');
            mustContain('src/lib/github-profile.ts',targetEngine,'Control Centre Engine repository');
            mustContain('src/lib/github-profile.ts','UPDATE_RELEASE','Control Centre Engine release ref');
            mustNotContain('src/lib/github-profile.ts','UPDATE_RELEASES','Control Centre legacy Engine release ref');
          }else if(key==='engine'){
            mustContain('release/update-baseline.json',targetEngine,'Engine baseline repository');
            mustContain('release/update-baseline.json','UPDATE_RELEASE','Engine release ref');
            mustNotContain('release/update-baseline.json','UPDATE_RELEASES','Engine legacy release ref');
          }
          NODE
          }

          for key in "$SYNC_PAIR"; do
            src="source-$key"
            dst="target-$key"
            echo "::group::Prepare $key"
            git -C "$dst" rev-parse HEAD > "$RUNNER_TEMP/orbitfs-sync/$key.expected"

            # Convert both temporary trees to the target repository identity.
            # The explicitly selected source direction is authoritative for this run.
            echo "::notice::$key target content will be reconciled to the explicitly selected source direction."

                        excludes=(
              --exclude=".git/"
              --exclude=".github/workflows/"
              --exclude=".vercel/"
              --exclude=".env"
              --exclude=".env.*"
              --exclude="*.pem"
              --exclude="*.key"
              --exclude="*.p12"
              --exclude="*.pfx"
              --exclude="service-account.json"
              --exclude="credentials.json"
              --exclude="vault*.json"
              --exclude="*vault*export*.json"
              --exclude="supabase/.temp/"
              --exclude="supabase/.branches/"
              --exclude="supabase/.profiles/"
              --exclude="supabase/config.toml"
            )
            case "$key" in
              base)
                excludes+=(--exclude="src/lib/server/database-package-registry.ts")
                excludes+=(--exclude="src/lib/server/license.ts")
                excludes+=(--exclude="src/lib/server/update-checkpoints.ts")
                excludes+=(--exclude="src/lib/server/vercel-engine-provision.ts")
                excludes+=(--exclude="tools/build-database-package.mjs")
                excludes+=(--exclude="tools/source-mode-switch.test.mjs")
                ;;
              engine)
                excludes+=(--exclude="src/lib/server/license.ts")
                excludes+=(--exclude="release/update-baseline.json")
                excludes+=(--exclude="tools/build-database-package.mjs")
                ;;
              license)
                # API key environments are repository identities, not feature drift.
                # Normalize the temporary source to the target identity, so future
                # shared API key fixes can still synchronize without copying MAIN
                # credentials or changing FALLBACK's authentication boundary.
                api_key_file="$src/lib/core/api-keys.ts"
                test -f "$api_key_file" || { echo "::error::Missing License Manager API key identity file."; exit 1; }
                if [ "$SYNC_DIRECTION" = "main-to-fallback" ]; then
                  api_key_environment="fallback"
                else
                  api_key_environment="main"
                fi
                API_KEY_FILE="$api_key_file" API_KEY_ENV="$api_key_environment" node <<'NODE'
          const fs = require('fs');
          const file = process.env.API_KEY_FILE;
          const content = fs.readFileSync(file, 'utf8');
          const identity = /export const API_KEY_ENVIRONMENT = '(main|fallback)' as const;/g;
          const matches = [...content.matchAll(identity)];
          if (matches.length !== 1) throw new Error('Unexpected License Manager API key identity declaration');
          fs.writeFileSync(file, content.replace(identity, "export const API_KEY_ENVIRONMENT = '" + process.env.API_KEY_ENV + "' as const;"));
          NODE
                excludes+=(--exclude="app/api/v1/engine-bootstrap/route.ts")
                excludes+=(--exclude="app/api/v1/license/validate/route.ts")
                excludes+=(--exclude="app/api/v1/releases/route.ts")
                excludes+=(--exclude="app/layout.tsx")
                excludes+=(--exclude="database/migrations/20261004100000_license_manager_github_profile.sql")
                excludes+=(--exclude="lib/core/database-packages.ts")
                excludes+=(--exclude="lib/core/releases.ts")
                excludes+=(--exclude="lib/core/source-activation.ts")
                excludes+=(--exclude="middleware.ts")
                excludes+=(--exclude="scripts/release-manifest.mjs")
                excludes+=(--exclude="scripts/release-manifest.test.mjs")
                ;;
              billing)
                excludes+=(--exclude="scripts/release-manifest.mjs")
                excludes+=(--exclude="src/app/admin/settings/api-connections/page.tsx")
                excludes+=(--exclude="src/app/admin/settings/deployment-providers/page.tsx")
                excludes+=(--exclude="src/app/admin/settings/license-master/page.tsx")
                excludes+=(--exclude="src/app/api/admin/settings/license-master/route.ts")
                excludes+=(--exclude="src/lib/license-master-config.ts")
                excludes+=(--exclude="src/lib/orbitfs-deployment.ts")
                excludes+=(--exclude="src/proxy.ts")
                ;;
              control)
                excludes+=(--exclude="src/lib/github-profile.ts")
                excludes+=(--exclude="src/routes/api/github-profile.ts")
                excludes+=(--exclude="src/routes/api/health.ts")
                excludes+=(--exclude="src/start.ts")
                ;;
            esac
            # Preserve destination edits and examine every pair before any push.
            last_mirror="$(git -C "$dst" log -1 --format=%H --grep="^Sync main from mirror source" || true)"
            source_sha="$(git -C "$src" rev-parse HEAD)"
            previous_source=""
            if [ -n "$last_mirror" ]; then
              previous_source="$(git -C "$dst" log -1 --format=%B "$last_mirror" | sed -n "s/^OrbitFS-Source-SHA: //p" | head -1)"
            fi
            if [ -n "$previous_source" ] && ! git -C "$src" cat-file -e "$previous_source^{commit}" 2>/dev/null; then previous_source=""; fi
            conflicts="$RUNNER_TEMP/orbitfs-sync/$key.conflicts"
            : > "$conflicts"
            candidates="$RUNNER_TEMP/orbitfs-sync/$key.candidates"
            rsync -ani "${excludes[@]}" "$src/" "$dst/" | awk '/^>f/ {print substr($0,12)}' > "$candidates"
            while IFS= read -r changed; do
              [ -f "$src/$changed" ] && [ -f "$dst/$changed" ] || continue
              cmp -s "$src/$changed" "$dst/$changed" && continue
              destination_changed=true
              if [ -n "$last_mirror" ] && git -C "$dst" diff --quiet "$last_mirror" HEAD -- "$changed"; then destination_changed=false; fi
              [ "$destination_changed" = true ] || continue
              merged=false
              if [ -n "$previous_source" ] && git -C "$src" cat-file -e "$previous_source:$changed" 2>/dev/null; then
                base_file="$(mktemp)"
                output_file="$(mktemp)"
                git -C "$src" show "$previous_source:$changed" > "$base_file"
                if git merge-file -p "$dst/$changed" "$base_file" "$src/$changed" > "$output_file"; then
                  cp "$output_file" "$dst/$changed"
                  merged=true
                fi
                rm -f "$base_file" "$output_file"
              fi
              excludes+=("--exclude=$changed")
              if [ "$merged" = false ]; then
                printf "%s\n" "$changed" >> "$conflicts"
                echo "::warning::$key independent destination edit preserved: $changed"
              else
                echo "::notice::$key merged independent change: $changed"
              fi
            done < "$candidates"
            rsync -a "${excludes[@]}" "$src/" "$dst/"
            remaining="$(rsync -ani "${excludes[@]}" "$src/" "$dst/")"
            test -z "$remaining" || { echo "::error::Portable sync verification failed for $key"; printf "%s\n" "$remaining"; exit 1; }
            git -C "$dst" config user.name "OrbitFS Repository Sync"
            git -C "$dst" config user.email "actions@users.noreply.github.com"
            git -C "$dst" add -A
            # Feature sync must never remove existing destination code.
            deleted="$(git -C "$dst" diff --cached --diff-filter=D --name-only)"
            test -z "$deleted" || { echo "::error::Sync attempted destination deletions for $key; refusing."; printf '%s\n' "$deleted"; exit 1; }
            while IFS= read -r staged; do
              [ -n "$staged" ] || continue
              case "$staged" in
                .github/workflows/*|.env|.env.*|.vercel/*|*.pem|*.key|*.p12|*.pfx|*credentials.json|*service-account.json|*vault*export*.json|supabase/config.toml)
                  echo "::error::Protected configuration was staged: $staged"
                  exit 1 ;;
              esac
              for argument in "${excludes[@]}"; do
                if [ "$argument" = "--exclude=$staged" ]; then
                  echo "::error::Mode-owned source was staged: $staged"
                  exit 1
                fi
              done
            done < <(git -C "$dst" diff --cached --name-only)
            if git -C "$dst" diff --cached --quiet; then
              if git -C "$dst" log -1 --format='%s' | grep -qx 'Sync main from mirror source'; then
                echo "current" > "$RUNNER_TEMP/orbitfs-sync/$key.state"
                echo "$key already current and marker is present"
              else
                echo "changed" > "$RUNNER_TEMP/orbitfs-sync/$key.state"
                git -C "$dst" commit --allow-empty --quiet -m "Sync main from mirror source" -m "OrbitFS-Source-SHA: $source_sha"
                target_ref="main"
                git -C "$dst" push --dry-run origin "HEAD:$target_ref"
                echo "$key content is current; bootstrap marker prepared"
              fi
            else
              echo "changed" > "$RUNNER_TEMP/orbitfs-sync/$key.state"
              git -C "$dst" commit --quiet -m "Sync main from mirror source" -m "OrbitFS-Source-SHA: $source_sha"
              target_ref="main"
              git -C "$dst" push --dry-run origin "HEAD:$target_ref"
              echo "$key prepared and push permission verified"
            fi
            echo "::endgroup::"
          done

      - name: Preview summary
        if: ${{ inputs.preview != 'false' }}
        shell: bash
        run: |
          echo "## Selected-repository synchronization preview: $SYNC_PAIR ($SYNC_DIRECTION)" >> "$GITHUB_STEP_SUMMARY"
          echo "No changes pushed. Review this single-pair preflight before approving Apply in Dev Panel." >> "$GITHUB_STEP_SUMMARY"
          for key in "$SYNC_PAIR"; do
            echo "- $key: $(cat "$RUNNER_TEMP/orbitfs-sync/$key.state")" >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$RUNNER_TEMP/orbitfs-sync/$key.conflicts" ]; then
              echo "  - Destination edits preserved; require reconciliation:" >> "$GITHUB_STEP_SUMMARY"
              sed "s/^/    - /" "$RUNNER_TEMP/orbitfs-sync/$key.conflicts" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Apply and verify
        if: ${{ inputs.preview == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SYNC_DIRECTION" = "main-to-fallback" ]; then
            direction="lucaskerim123 → remipetrovich-design"
          else
            direction="remipetrovich-design → lucaskerim123"
          fi
          {
            echo "## Repository mirror sync"
            echo ""
            echo "**Direction:** $direction"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Apply refuses unresolved edits in the selected repository.
          for key in "$SYNC_PAIR"; do
            if [ -s "$RUNNER_TEMP/orbitfs-sync/$key.conflicts" ]; then
              echo "::error::$key has unresolved independent edits; review preview before Apply."
              exit 1
            fi
          done
          # Re-check the selected target immediately before any push.
          for key in "$SYNC_PAIR"; do
            dst="target-$key"
            expected="$(cat "$RUNNER_TEMP/orbitfs-sync/$key.expected")"
            git -C "$dst" fetch --quiet origin main
            remote_before="$(git -C "$dst" rev-parse origin/main)"
            test "$remote_before" = "$expected" || { echo "::error::Remote main changed after preflight for $key; refusing the selected repository sync."; exit 1; }
          done

          for key in "$SYNC_PAIR"; do
            src="source-$key"
            dst="target-$key"
            target_ref="main"
            state="$(cat "$RUNNER_TEMP/orbitfs-sync/$key.state")"
            if [ "$state" = "changed" ]; then
              expected="$(cat "$RUNNER_TEMP/orbitfs-sync/$key.expected")"
              git -C "$dst" fetch --quiet origin "$target_ref"
              remote_before="$(git -C "$dst" rev-parse "origin/$target_ref")"
              test "$remote_before" = "$expected" || { echo "::error::Remote $target_ref changed after preflight for $key; refusing to overwrite newer work."; exit 1; }
              git -C "$dst" push origin "HEAD:$target_ref"
              git -C "$dst" fetch --quiet origin "$target_ref"
              test "$(git -C "$dst" rev-parse HEAD)" = "$(git -C "$dst" rev-parse "origin/$target_ref")" || { echo "::error::Remote main verification failed for $key."; exit 1; }
              test "$(git -C "$dst" log -1 --format='%s' "origin/$target_ref")" = "Sync main from mirror source" || { echo "::error::Remote main marker verification failed for $key."; exit 1; }
                            excludes=(
                --exclude=".git/"
                --exclude=".github/workflows/"
                --exclude=".vercel/"
                --exclude=".env"
                --exclude=".env.*"
                --exclude="**/.env"
                --exclude="**/.env.*"
                --exclude="**/.vercel/**"
                --exclude="**/secrets/**"
                --exclude="**/.aws/**"
                --exclude="**/service-account.json"
                --exclude="**/credentials.json"
                --exclude="*.pem"
                --exclude="*.key"
                --exclude="*.p12"
                --exclude="*.pfx"
                --exclude="service-account.json"
                --exclude="credentials.json"
                --exclude="vault*.json"
                --exclude="*vault*export*.json"
                --exclude="supabase/.temp/"
                --exclude="supabase/.branches/"
                --exclude="supabase/.profiles/"
                --exclude="supabase/config.toml"
              )
              case "$key" in
                base)
                  excludes+=(--exclude="src/lib/server/database-package-registry.ts")
                  excludes+=(--exclude="src/lib/server/license.ts")
                  excludes+=(--exclude="src/lib/server/update-checkpoints.ts")
                  excludes+=(--exclude="src/lib/server/vercel-engine-provision.ts")
                  excludes+=(--exclude="tools/build-database-package.mjs")
                  excludes+=(--exclude="tools/source-mode-switch.test.mjs")
                  ;;
                engine)
                  excludes+=(--exclude="src/lib/server/license.ts")
                  excludes+=(--exclude="release/update-baseline.json")
                  excludes+=(--exclude="tools/build-database-package.mjs")
                  ;;
                license)
                  excludes+=(--exclude="app/api/v1/engine-bootstrap/route.ts")
                  excludes+=(--exclude="app/api/v1/license/validate/route.ts")
                  excludes+=(--exclude="app/api/v1/releases/route.ts")
                  excludes+=(--exclude="app/layout.tsx")
                  excludes+=(--exclude="database/migrations/20261004100000_license_manager_github_profile.sql")
                  excludes+=(--exclude="lib/core/database-packages.ts")
                  excludes+=(--exclude="lib/core/releases.ts")
                  excludes+=(--exclude="lib/core/source-activation.ts")
                  excludes+=(--exclude="middleware.ts")
                  excludes+=(--exclude="scripts/release-manifest.mjs")
                  excludes+=(--exclude="scripts/release-manifest.test.mjs")
                  ;;
                billing)
                  excludes+=(--exclude="scripts/release-manifest.mjs")
                  excludes+=(--exclude="src/app/admin/settings/api-connections/page.tsx")
                  excludes+=(--exclude="src/app/admin/settings/deployment-providers/page.tsx")
                  excludes+=(--exclude="src/app/admin/settings/license-master/page.tsx")
                  excludes+=(--exclude="src/app/api/admin/settings/license-master/route.ts")
                  excludes+=(--exclude="src/lib/license-master-config.ts")
                  excludes+=(--exclude="src/lib/orbitfs-deployment.ts")
                  excludes+=(--exclude="src/proxy.ts")
                  ;;
                control)
                  excludes+=(--exclude="src/lib/github-profile.ts")
                  excludes+=(--exclude="src/routes/api/github-profile.ts")
                  excludes+=(--exclude="src/routes/api/health.ts")
                  excludes+=(--exclude="src/start.ts")
                  ;;
              esac
              # A successful three-way merge differs from source by design.
              # The remote commit SHA and marker are verified above; no byte-
              # identical copy requirement may invalidate a merged result.
              echo "- $key — synced commit verified; target configuration preserved" >> "$GITHUB_STEP_SUMMARY"
            else
              git -C "$dst" fetch --quiet origin "$target_ref"
              test "$(git -C "$dst" log -1 --format='%s' "origin/$target_ref")" = "Sync main from mirror source" || { echo "::error::Remote main marker verification failed for current $key."; exit 1; }
              echo "- ✅ $key — already current and marker verified" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected repository commit verified; independent target configuration and workflows are preserved." >> "$GITHUB_STEP_SUMMARY"
