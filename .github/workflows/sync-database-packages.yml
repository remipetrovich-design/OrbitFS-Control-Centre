name: Database package sync disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Use release-bound database packaging
        shell: bash
        run: |
          echo "::error::Direct database-package synchronization is disabled. Base packages are built by the Base release workflow and Engine component packages are built by the Engine release workflow so they remain source-locked, release-bound and profile-safe."
          exit 1
