name: Deploy Dev Panel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-panel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      VERCEL_ORG_ID: team_W3fS0X03YCjNkD2BoqRj6Uld
      VERCEL_PROJECT_ID: prj_o5ju4zFGSDZelX4SA7GAu3rQqtap
      VERCEL_SCOPE: retroreview12-8045
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: 59.23.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify package manager
        run: bun --version

      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub secret VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Install pinned Vercel CLI
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Verify Vercel account access
        shell: bash
        run: |
          set -euo pipefail
          echo "Authenticated Vercel user:"
          vercel whoami --token="$VERCEL_TOKEN"
          echo "Available Vercel teams:"
          vercel teams ls --token="$VERCEL_TOKEN"

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Verify pulled project identity
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/project.json
          node - <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(project.orgId!==process.env.VERCEL_ORG_ID) throw new Error('Vercel org mismatch');
          if(project.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('Vercel project mismatch');
          NODE

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Build Vercel production artifact
        env:
          VERCEL: "1"
          ORBITFS_VERCEL_BUILD: "1"
        run: bun run build

      - name: Verify Vercel build output
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -d .vercel/output/functions -o -d .vercel/output/static
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('.vercel/output/config.json','utf8'));
          if(Number(config.version)!==3) throw new Error('Unexpected Vercel Build Output API version');
          NODE

      - name: Deploy production
        run: vercel deploy --prebuilt --archive=tgz --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
