name: Deploy Dev Panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-panel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      VERCEL_ORG_ID: team_W3fS0X03YCjNkD2BoqRj6Uld
      VERCEL_PROJECT_ID: prj_o5ju4zFGSDZelX4SA7GAu3rQqtap
      VERCEL_SCOPE: retroreview12-8045
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: 59.23.1
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: primary
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://dev.incendiarynetworks.cc/api/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. This repository will not build or deploy production."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        if: steps.profile.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify package manager
        if: steps.profile.outputs.deploy == 'true'
        run: bun --version

      - name: Require Vercel token
        if: steps.profile.outputs.deploy == 'true'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::GitHub secret VERCEL_TOKEN is not configured"
            exit 1
          fi

      - name: Install pinned Vercel CLI
        if: steps.profile.outputs.deploy == 'true'
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Verify Vercel account access
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Authenticated Vercel user:"
          vercel whoami --token="$VERCEL_TOKEN"
          echo "Available Vercel teams:"
          vercel teams ls --token="$VERCEL_TOKEN"

      - name: Pull production project settings
        if: steps.profile.outputs.deploy == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Verify pulled project identity
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/project.json
          node - <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(project.orgId!==process.env.VERCEL_ORG_ID) throw new Error('Vercel org mismatch');
          if(project.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('Vercel project mismatch');
          NODE

      - name: Install app dependencies
        if: steps.profile.outputs.deploy == 'true'
        run: bun install --frozen-lockfile

      - name: Database automation contract
        if: steps.profile.outputs.deploy == 'true'
        run: node scripts/database-automation-contract.test.mjs

      - name: Build Vercel production artifact
        if: steps.profile.outputs.deploy == 'true'
        env:
          VERCEL: "1"
          ORBITFS_VERCEL_BUILD: "1"
        run: bun run build

      - name: Verify Vercel build output
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -d .vercel/output/functions -o -d .vercel/output/static
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('.vercel/output/config.json','utf8'));
          if(Number(config.version)!==3) throw new Error('Unexpected Vercel Build Output API version');
          NODE

      - name: Deploy production
        if: steps.profile.outputs.deploy == 'true'
        run: vercel deploy --prebuilt --archive=tgz --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
