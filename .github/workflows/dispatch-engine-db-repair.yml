name: Dispatch Engine database repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-engine-db-repair.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fallback Engine release
        env:
          GH_TOKEN: ${{ secrets.ORBITFS_FALLBACK_GITHUB_TOKEN }}
          SOURCE_SHA: 68440a8cd0f0b98a21ec9896fddc476e2a4fc50f
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          for stale in 37157892120 37172307648; do
            curl --silent --show-error -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/remipetrovich-design/OrbitFS_Engine/actions/runs/$stale/force-cancel" >/dev/null || true
          done
          payload="$(jq -nc --arg source "$SOURCE_SHA" '{
            ref:"UPDATE_RELEASE",
            inputs:{
              version:"1.0.0",
              source_sha:$source,
              channel:"stable",
              base_channel:"stable",
              apex:"true",
              mcp:"true",
              studio:"true",
              minimum_deployer_protocol:"1",
              minimum_base_version:"1.0.0",
              previous_source_commit:"",
              notes:"Database split repair: complete Shared/MCP/APEX/Studio database contract with Base-owned inner-deployer execution."
            }
          }')"
          curl --fail-with-body --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/remipetrovich-design/OrbitFS_Engine/actions/workflows/publish-engine-release.yml/dispatches"             -d "$payload"

# post-actions-enable dispatch
