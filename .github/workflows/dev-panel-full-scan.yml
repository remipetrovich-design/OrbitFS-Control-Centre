name: Dev Panel Full Scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run checked-in tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/*.test.mjs tests/*.test.mjs)
          if [ ${#tests[@]} -gt 0 ]; then
            node --experimental-strip-types --test "${tests[@]}"
          fi
      - name: Validate production build
        run: bun run build
