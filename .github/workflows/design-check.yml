name: Dev Panel build check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: primary
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://dev.incendiarynetworks.cc/api/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. Remaining workflow steps are disabled."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.profile.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Setup Node
        if: steps.profile.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        if: steps.profile.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        if: steps.profile.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - name: Typecheck
        if: steps.profile.outputs.run == 'true'
        continue-on-error: true
        run: bun x tsc --noEmit
      - name: Database automation contract
        if: steps.profile.outputs.run == 'true'
        run: node scripts/database-automation-contract.test.mjs

      - name: Build
        if: steps.profile.outputs.run == 'true'
        env:
          VERCEL: "1"
          ORBITFS_VERCEL_BUILD: "1"
        run: bun run build
