name: Publish Engine database repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-engine-db-repair.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate approve and publish repaired Engine update
        env:
          LICENSE_MASTER_API_TOKEN: ${{ secrets.LICENSE_MASTER_API_TOKEN }}
          RELEASE_ID: aa1e1453-8dc3-4f72-82cf-540fba9a1bcd
        shell: bash
        run: |
          set -euo pipefail
          base="https://incendiarynetworks.cc/api/v1/releases/$RELEASE_ID"
          auth=(-H "Authorization: Bearer $LICENSE_MASTER_API_TOKEN" -H "Content-Type: application/json")
          validation="$(curl --fail-with-body --silent --show-error -X POST "$base/validate" "${auth[@]}")"
          test "$(jq -r '.validation.status // empty' <<<"$validation")" = "passed" || { echo "$validation"; exit 1; }
          approved="$(curl --fail-with-body --silent --show-error -X POST "$base" "${auth[@]}" -d '{"action":"approve","reason":"Database repair update passed full technical validation after GitHub run completion."}')"
          test "$(jq -r '.release.review_status // empty' <<<"$approved")" = "approved" || { echo "$approved"; exit 1; }
          published="$(curl --fail-with-body --silent --show-error -X POST "$base" "${auth[@]}" -d '{"action":"publish"}')"
          test "$(jq -r '.release.status // empty' <<<"$published")" = "published" || { echo "$published"; exit 1; }
          echo "Published Engine database repair release $RELEASE_ID"
