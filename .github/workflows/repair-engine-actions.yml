name: Repair Engine Actions admission

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-engine-actions.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure fallback Engine Actions are enabled
        env:
          GH_TOKEN: ${{ secrets.ORBITFS_FALLBACK_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/remipetrovich-design/OrbitFS_Engine/actions/permissions"
          before="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28" "$api")"
          echo "Before: $before"
          enabled="$(jq -r '.enabled // false' <<<"$before")"
          allowed="$(jq -r '.allowed_actions // "all"' <<<"$before")"
          if [ "$enabled" != "true" ] || [ "$allowed" = "selected" ]; then
            curl --fail-with-body --silent --show-error -X PUT               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: application/json"               "$api" -d '{"enabled":true,"allowed_actions":"all"}'
          fi
          after="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28" "$api")"
          echo "After: $after"
          test "$(jq -r '.enabled' <<<"$after")" = "true"
