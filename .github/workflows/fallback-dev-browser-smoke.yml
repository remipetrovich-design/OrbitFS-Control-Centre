name: Fallback Dev Panel Browser Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fallback-dev-browser-smoke.yml
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'remipetrovich-design/OrbitFS-Control-Centre'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install isolated browser tester
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/orbitfs-browser-smoke
          cd /tmp/orbitfs-browser-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify actual Fallback page in Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/orbitfs-browser-smoke
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',error=>errors.push(String(error?.message||error).slice(0,220)));
              const response=await page.goto('https://dev1.incendiarynetworks.cc/',{waitUntil:'domcontentloaded',timeout:40000});
              await page.waitForTimeout(4000);
              const body=(await page.locator('body').innerText()).slice(0,4000);
              console.log('PAGE HTTP',response?.status());
              console.log('FINAL URL',page.url());
              console.log('PAGE TITLE',await page.title());
              console.log('LOGIN PASSWORD INPUTS',await page.locator('input[type=password]').count());
              console.log('BROWSER ERRORS',JSON.stringify(errors));
              console.log('PAGE TEXT',body.slice(0,450).replace(/\\s+/g,' '));
              await page.screenshot({path:'/tmp/orbitfs-dev1-browser.png',fullPage:true});
              if(response?.status()!==200)throw Error('Fallback Dev Panel page is not HTTP 200');
              if(body.includes('Missing server environment variable')||body.includes("This page didn't load"))throw Error('Fallback Dev Panel renders the server-variable error page');
              if(errors.some(e=>e.includes('LICENSE_MASTER_URL')||e.includes('TRUSTED_MASTER')))throw Error('Browser startup references server-only Fallback env variable');
              if(await page.locator('input[type=password]').count()===0)throw Error('Fallback Dev Panel login form not visible');
              console.log('FALLBACK DEV1 CHROMIUM BROWSER SMOKE PASSED');
            }finally{await browser.close();}
          })().catch(err=>{console.error('BROWSER TEST FAILED:',err.message);process.exitCode=1;});
          NODE
      - name: Save browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallback-dev1-browser
          path: /tmp/orbitfs-dev1-browser.png
          if-no-files-found: ignore
